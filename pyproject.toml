# uv workspace of the Python services. One lock file, uv.lock, pins every dependency of every member.
[project]
name = "costguard-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/python/*", "apps/python/*"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pypdf>=5.1", "pyyaml>=6.0"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["costguard_common", "costguard_ingest", "costguard_connectors", "costguard_anomaly", "costguard_notary", "costguard_reports", "costguard"]
