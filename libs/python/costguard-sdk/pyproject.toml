[project]
name = "costguard"
version = "0.1.0"
description = "CostGuard SDK for agents: ask before spending, settle what was spent, wait for a human approval"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costguard"]
