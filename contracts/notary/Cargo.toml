[package]
name = "costguard-notary"
version = "0.1.0"
edition = "2021"
description = "Anchors Merkle roots of CostGuard journal receipts and proves receipts against them"
publish = false
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5"

[dev-dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
