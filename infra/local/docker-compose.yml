# Local infrastructure. Start with `make up` from the repository root.
name: costguard

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: costguard
      POSTGRES_USER: ${DB_USER:-costguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-costguard}
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-costguard} -d costguard"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on: [kafka]
    ports: ["8085:8081"]   # 8081 on the host belongs to the gateway
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123"]   # native port 9000 is not published: MinIO uses it
    environment:
      CLICKHOUSE_DB: costguard
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-costguard}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-costguard}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: [clickhouse:/var/lib/clickhouse]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-costguard}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-costguard-secret}
    volumes: [minio:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports: ["8180:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes: ["../keycloak:/opt/keycloak/data/import:ro"]

  vault:
    image: hashicorp/vault:1.18
    ports: ["8200:8200"]
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

volumes:
  postgres:
  clickhouse:
  minio:
