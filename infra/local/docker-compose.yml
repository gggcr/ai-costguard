# Local infrastructure. Start with `make up` from the repository root.
name: costguard

services:
  postgres:
    image: postgres:17
    environment:
      # The image makes this user a superuser, so it is only for administration.
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-postgres}
      # The application connects as this ordinary role: a superuser bypasses row-level security.
      DB_USER: ${DB_USER:-costguard}
      DB_PASSWORD: ${DB_PASSWORD:-costguard}
    # POSTGRES_PORT moves it off 5432 when a native PostgreSQL already listens there.
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/fix-app-role.sql:/opt/costguard/fix-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-postgres} -d costguard"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on: [kafka]
    ports: ["8085:8081"]   # 8081 on the host belongs to the gateway
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123"]   # native port 9000 is not published: S3 uses it
    environment:
      CLICKHOUSE_DB: costguard
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-costguard}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-costguard}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: [clickhouse:/var/lib/clickhouse]

  # S3 for uploaded files. MinIO no longer publishes images, so SeaweedFS serves the same API on the same port;
  # the keys are in seaweedfs/s3.json and match S3_ACCESS_KEY / S3_SECRET_KEY of .env.example.
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:8333"]
    volumes:
      - s3:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports: ["8180:8080"]
    environment:
      # Tokens say localhost:8180, which the browser uses; services in the stack fetch keys from keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes: ["../keycloak:/opt/keycloak/data/import:ro"]

  vault:
    image: hashicorp/vault:1.18
    ports: ["8200:8200"]
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

  # Schedules (infra/airflow). Not started by `make up`: `make airflow` starts it. Standalone mode with SQLite is
  # for a laptop only; the UI is on http://localhost:8088, user admin, the password is in the container log.
  airflow:
    image: apache/airflow:2.10.5-python3.12
    profiles: [airflow]
    command: >
      bash -c "pip install --no-cache-dir /opt/costguard/src/libs/python/costguard-common
      /opt/costguard/src/apps/python/connectors /opt/costguard/src/apps/python/reports && airflow standalone"
    ports: ["8088:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      COSTGUARD_TENANTS_DIR: /opt/costguard/tenants
      COSTGUARD_REPORTS_DIR: /opt/costguard/reports
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../..:/opt/costguard/src:ro
      - ./airflow/tenants:/opt/costguard/tenants:ro
      - ./airflow/reports:/opt/costguard/reports

  # The core and the gateway for `make demo`; build the jars first (the target does it).
  core:
    profiles: [demo]
    build: ../../apps/backend/core
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      schema-registry: { condition: service_started }
    ports: ["8080:8080"]
    environment: &backend
      DB_URL: jdbc:postgresql://postgres:5432/costguard
      DB_USER: ${DB_USER:-costguard}
      DB_PASSWORD: ${DB_PASSWORD:-costguard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_HOST: redis
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/costguard
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/costguard/protocol/openid-connect/certs
      CBR_RATES_ENABLED: "false"
      # Findings appear a minute after the seed instead of an hour.
      COSTGUARD_AUDIT_DELAY: PT1M
    healthcheck:
      # Tomcat opens the port after Flyway has migrated, so an open port means the tables exist.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 5s
      retries: 60

  gateway:
    profiles: [demo]
    build: ../../apps/backend/gateway
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_started }
      schema-registry: { condition: service_started }
    ports: ["8081:8081"]
    environment: *backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081'"]
      interval: 5s
      retries: 60

volumes:
  postgres:
  clickhouse:
  s3:
