# Local infrastructure. Start with `make up` from the repository root.
name: costguard

services:
  postgres:
    image: postgres:17
    environment:
      # The image makes this user a superuser, so it is only for administration.
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-postgres}
      # The application connects as this ordinary role: a superuser bypasses row-level security.
      DB_USER: ${DB_USER:-costguard}
      DB_PASSWORD: ${DB_PASSWORD:-costguard}
    # POSTGRES_PORT moves it off 5432 when a native PostgreSQL already listens there.
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/fix-app-role.sql:/opt/costguard/fix-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-postgres} -d costguard"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # Creates every topic of schemas/avro once Kafka is up, as Terraform does in the cloud. Without it a topic exists
  # only after its first message, and a consumer of the pipeline waits for it (costguard_common.consuming).
  topics:
    image: apache/kafka:3.9.0
    depends_on: [kafka]
    volumes:
      - ../../schemas/avro:/schemas:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do sleep 2; done
        for f in /schemas/*.avsc; do
          t=$${f##*/}
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${t%.avsc}" --partitions 3
        done

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on: [kafka]
    ports: ["8085:8081"]   # 8081 on the host belongs to the gateway
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123"]   # native port 9000 is not published: S3 uses it
    environment:
      CLICKHOUSE_DB: costguard
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-costguard}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-costguard}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: [clickhouse:/var/lib/clickhouse]

  # S3 for uploaded files. MinIO no longer publishes images, so SeaweedFS serves the same API on the same port;
  # the keys are in seaweedfs/s3.json and match S3_ACCESS_KEY / S3_SECRET_KEY of .env.example.
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:8333"]
    volumes:
      - s3:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports: ["8180:8080"]
    environment:
      # Tokens say localhost:8180, which the browser uses; services in the stack fetch keys from keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes: ["../keycloak:/opt/keycloak/data/import:ro"]

  vault:
    image: hashicorp/vault:1.18
    ports: ["8200:8200"]
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

  # Schedules (infra/airflow). Not started by `make up`: `make airflow` starts it. Standalone mode with SQLite is
  # for a laptop only; the UI is on http://localhost:8088, user admin, the password is in the container log.
  airflow:
    image: apache/airflow:2.10.5-python3.12
    profiles: [airflow]
    command: >
      bash -c "pip install --no-cache-dir /opt/costguard/src/libs/python/costguard-common
      /opt/costguard/src/apps/python/connectors /opt/costguard/src/apps/python/reports && airflow standalone"
    ports: ["8088:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # the core starts costguard_connector_sync with basic auth (password: standalone_admin_password.txt)
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      COSTGUARD_TENANTS_DIR: /opt/costguard/tenants
      COSTGUARD_REPORTS_DIR: /opt/costguard/reports
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../..:/opt/costguard/src:ro
      - ./airflow/tenants:/opt/costguard/tenants:ro
      - ./airflow/reports:/opt/costguard/reports

  # The core and the gateway for `make demo`; build the jars first (the target does it).
  core:
    profiles: [demo]
    build: ../../apps/backend/core
    depends_on:
      # consumers subscribe at start: the topics must exist by then
      topics: { condition: service_completed_successfully }
      s3: { condition: service_started }
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      schema-registry: { condition: service_started }
    ports: ["8080:8080"]
    environment: &backend
      DB_URL: jdbc:postgresql://postgres:5432/costguard
      DB_USER: ${DB_USER:-costguard}
      DB_PASSWORD: ${DB_PASSWORD:-costguard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_HOST: redis
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/costguard
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/costguard/protocol/openid-connect/certs
      CBR_RATES_ENABLED: "false"
      # Erasures delete Keycloak accounts through the admin API (ADR 0021); the client is in costguard-realm.json.
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_PRIVACY_CLIENT_SECRET: ${KEYCLOAK_PRIVACY_CLIENT_SECRET:-costguard-privacy-local}
      # Self-registration and invitations create accounts as costguard-registration (ADR 0036); Keycloak's e-mail
      # goes to Mailpit too.
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:-costguard-registration-local}
      # Payments succeed without money here (ADR 0038); never in staging or prod.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-dummy}
      # make demo-lite sets CORE_CLICKHOUSE_URL to empty: without ClickHouse the journal answers at once, empty
      CLICKHOUSE_URL: ${CORE_CLICKHOUSE_URL-http://clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-costguard}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-costguard}
      # Findings appear a minute after the seed instead of an hour.
      COSTGUARD_AUDIT_DELAY: PT1M
      # A development key only: secrets of connections made locally are encrypted with it (ADR 0030).
      CONNECTIONS_ENCRYPTION_KEY: ${CONNECTIONS_ENCRYPTION_KEY:-ZGV2LW9ubHktY29ubmVjdGlvbnMta2V5LTMyLWJ5dGU=}
      # E-mail goes to Mailpit: open http://localhost:8025 to read it. Telegram needs a bot token from @BotFather.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-costguard@localhost}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      # «Синхронизировать сейчас» starts costguard_connector_sync when the airflow profile runs
      AIRFLOW_URL: ${AIRFLOW_URL:-}
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-}
      # Uploaded files go to S3 (SeaweedFS here), where the ingest service below reads them, as in the cloud (ADR 0049).
      # The core creates the bucket here; in the cloud Terraform does.
      COSTGUARD_IMPORTS_S3_BUCKET: costguard-imports
      COSTGUARD_IMPORTS_S3_CREATE_BUCKET: "true"
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-costguard}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-costguard-secret}
      # Traces go to the OpenTelemetry Collector of the observability profile; off unless TRACING=true (ADR 0048).
      MANAGEMENT_TRACING_EXPORT_ENABLED: ${TRACING:-false}
      # locally every trace is kept; in a cluster TRACE_SAMPLING of the chart (0.1). Python services follow the
      # decision of the trace they continue.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACE_SAMPLING:-1.0}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      # `make demo-lite` runs without Kafka: consumers do not start, events wait in the outbox (ADR 0064)
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: ${KAFKA_LISTENERS:-true}
      # `make demo-lite` sets direct: the gateway reads its state from the core and posts operations to it, with no
      # Kafka or Schema Registry (ADR 0080). Both sides need the same INTERNAL_TOKEN.
      EVENTS_TRANSPORT: ${EVENTS_TRANSPORT:-kafka}
      CORE_EVENTS_KAFKA_ENABLED: ${CORE_EVENTS_KAFKA_ENABLED:-true}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      CORE_INTERNAL_URL: http://core:8080
      # a heap limit for small machines; empty — the JVM default
      JAVA_TOOL_OPTIONS: ${CORE_JAVA_OPTS:-}
    healthcheck:
      # Tomcat opens the port after Flyway has migrated, so an open port means the tables exist.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 5s
      retries: 60

  gateway:
    profiles: [demo]
    build: ../../apps/backend/gateway
    depends_on:
      # consumers subscribe at start: the topics must exist by then
      topics: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_started }
      schema-registry: { condition: service_started }
    ports: ["8081:8081"]
    environment: *backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081'"]
      interval: 5s
      retries: 60

  # The ingest pipeline for `make demo` (apps/python/ingest): reads what is uploaded to «Импорт» from the bucket the
  # core writes to, suggests the mapping, and writes cost records, devices and people. Without it uploads wait forever.
  ingest:
    profiles: [demo]
    build:
      context: ../..
      dockerfile: apps/python/ingest/Dockerfile
    depends_on:
      # consumers subscribe at start: the topics must exist by then
      topics: { condition: service_completed_successfully }
      core: { condition: service_healthy }
      kafka: { condition: service_started }
      schema-registry: { condition: service_started }
    # start again if Kafka or the schema registry is not up yet
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      INGEST_S3_BUCKET: costguard-imports
      # traces to the collector of the observability profile when started with TRACING=true (ADR 0050)
      COSTGUARD_TRACING: ${TRACING:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-costguard}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-costguard-secret}

  # Metrics, dashboards and traces (infra/observability, ADR 0048). Not started by `make up`: `make observability`
  # starts them; Grafana is on http://localhost:3001 (admin / admin), Prometheus on http://localhost:9090.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      TEMPO_OTLP_ENDPOINT: tempo:4317
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4318:4318"]
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.6.1
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0"        # a new named volume belongs to root; on a laptop only
    volumes:
      - ../observability/local/tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes:
      - ../observability/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ../observability/local/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/costguard.yaml:ro
      - ../observability/local/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/costguard.yaml:ro
      - ../../deploy/helm/costguard/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, tempo]

  # Catches the e-mail of the local stack: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  # The web client for `make demo`: http://localhost:3000, log in as demo / demo. nginx proxies /api to the core.
  frontend:
    profiles: [demo]
    build: ../../apps/frontend
    depends_on:
      core: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      CORE_URL: http://core:8080

  # MLflow for the models of the anomaly detector (ADR 0016, 0017). Not started by `make up`:
  # `docker compose --profile ml up -d mlflow`. Runs in SQLite on a volume, artifacts in SeaweedFS (bucket
  # costguard-mlflow, created on start). The detector reaches it at MLFLOW_TRACKING_URI=http://localhost:5000.
  mlflow:
    profiles: [ml]
    build: ../../deploy/mlflow
    ports: ["5000:5000"]
    user: "0"        # a new named volume belongs to root; on a laptop only
    depends_on: [s3]
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-costguard}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-costguard-secret}
    command:
      - sh
      - -c
      - >-
        python -c "import boto3, os; s3 = boto3.client('s3', endpoint_url=os.environ['MLFLOW_S3_ENDPOINT_URL']);
        names = [b['Name'] for b in s3.list_buckets().get('Buckets', [])];
        'costguard-mlflow' in names or s3.create_bucket(Bucket='costguard-mlflow')"
        && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////data/mlflow.db
        --artifacts-destination s3://costguard-mlflow --serve-artifacts
    volumes:
      - mlflow:/data

volumes:
  postgres:
  clickhouse:
  s3:
  mlflow:
  tempo:
