openapi: 3.1.0
info:
  title: CostGuard Core API
  version: v1
servers:
- url: /
security:
- bearer: []
tags:
- name: Approvals
  description: Operations waiting for a human decision
- name: Analytics
  description: Spending and savings for the dashboard
- name: Cabinet
  description: "The employee's own cabinet: only the person of the token"
- name: Activity log
  description: "Who changed what: budgets, mandates, roles, connections, equipment,\
    \ erasures"
- name: Assets
  description: "Employee equipment: who holds what and when it is due back"
- name: Notifications
  description: "The company feed, its live stream, e-mail and Telegram"
- name: Connections
  description: Systems the connector agent pulls and how each pull went
- name: Journal
  description: Signed receipts of operations and their anchoring in NEAR
- name: Registration
  description: Self-registration of a company and invitations of its people
- name: Plans
  description: "Pricing plans, their limits, the trial and payment"
- name: Organisation
  description: "Company, departments, employees, users and dismissals"
- name: Ledger
  description: Budgets and the journal of entries
- name: Catalog
  description: "Prices of models and paid APIs, Bank of Russia exchange rates"
- name: Privacy
  description: "Erasing an employee's personal data, erasing the company, and the\
    \ records of both"
- name: Findings
  description: Findings of the audit engine and their life cycle
- name: Software
  description: "Vendors, contracts, subscriptions and licenses"
- name: Policies
  description: "Company rules over agent operations, simulation and publication"
- name: SCIM
  description: Tokens of the SCIM server an identity provider provisions employees
    through
- name: Imports
  description: "Uploads, column mapping and manual review"
- name: Agents
  description: "AI agents, their virtual keys and mandates"
paths:
  /api/v1/vendors/{id}:
    put:
      tags:
      - Software
      summary: Change a vendor
      operationId: updateVendor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorDetails"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
  /api/v1/vacations/{id}/decision:
    put:
      tags:
      - Cabinet
      summary: Decide on a request as the employer (a department without a head)
      operationId: decideAsEmployer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VacationDecision"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacation"
  /api/v1/users/{id}/role:
    put:
      tags:
      - Organisation
      summary: Change a user's role
      description: The last owner cannot be demoted.
      operationId: changeRole
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChange"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
  /api/v1/subscriptions/{id}:
    get:
      tags:
      - Software
      summary: Get a subscription
      operationId: subscription
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    put:
      tags:
      - Software
      summary: Change a subscription
      description: Seats cannot drop below assigned licenses.
      operationId: updateSubscription
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionDetails"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
  /api/v1/products/{id}/category:
    put:
      tags:
      - Software
      summary: Say what a product is for
      description: "mail, documents, calls, chat, tasks, crm, wiki... The overlap\
        \ rule then takes it over the names it knows; a blank category gives the product\
        \ back to them."
      operationId: setCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCategory"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /api/v1/policies/rules/{id}:
    put:
      tags:
      - Policies
      summary: Change a rule
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleDetails"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRule"
    delete:
      tags:
      - Policies
      summary: Delete a rule
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/plans/{id}:
    put:
      tags:
      - Software
      summary: Change a plan
      operationId: updatePlan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanDetails"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      tags:
      - Software
      summary: Remove a plan
      operationId: deletePlan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/payroll/schedule:
    get:
      tags:
      - Cabinet
      summary: The days of the month the company pays the advance and the salary
      operationId: schedule
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollSchedule"
    put:
      tags:
      - Cabinet
      summary: Set the pay days
      operationId: saveSchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollSchedule"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollSchedule"
  /api/v1/notifications/{id}/read:
    put:
      tags:
      - Notifications
      summary: Mark one as read
      operationId: read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/notifications/settings:
    get:
      tags:
      - Notifications
      summary: My e-mail and Telegram notifications
      description: "Levels: off, info, warning, critical. Without saved settings:\
        \ e-mail for critical ones."
      operationId: settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
    put:
      tags:
      - Notifications
      summary: Change my notification levels
      operationId: saveSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsChange"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
  /api/v1/notifications/read:
    put:
      tags:
      - Notifications
      summary: Mark all as read
      operationId: readAll
      responses:
        "204":
          description: No Content
  /api/v1/me/team/vacations/{id}/decision:
    put:
      tags:
      - Cabinet
      summary: "Decide on a request of my department, as its head"
      operationId: decide
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VacationDecision"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacation"
  /api/v1/me/notifications/{id}/read:
    put:
      tags:
      - Cabinet
      summary: Mark one of my notifications as read
      operationId: read_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/me/notifications/read:
    put:
      tags:
      - Cabinet
      summary: Mark all my notifications as read
      operationId: readAll_1
      responses:
        "204":
          description: No Content
  /api/v1/mandates/{id}:
    get:
      tags:
      - Agents
      summary: Get a mandate
      operationId: mandate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandate"
    put:
      tags:
      - Agents
      summary: Edit a mandate
      description: It becomes a draft until published again.
      operationId: updateMandate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MandateDetails"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandate"
    delete:
      tags:
      - Agents
      summary: Delete a mandate that no agent uses
      operationId: deleteMandate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/mandates/{id}/publication:
    put:
      tags:
      - Agents
      summary: Publish a mandate to the gateway
      description: Idempotent.
      operationId: publishMandate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandate"
  /api/v1/licenses/{id}/activity:
    put:
      tags:
      - Software
      summary: Record the last login
      description: Only moves forward.
      operationId: activity
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Activity"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/License"
  /api/v1/license-requests/{id}/decision:
    put:
      tags:
      - Cabinet
      summary: Approve (an idle license goes back to the pool first) or reject a request
      operationId: decide_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseDecision"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseRequest"
  /api/v1/imports/{id}/review-tasks/{taskId}:
    put:
      tags:
      - Imports
      summary: Resolve a value the pipeline was unsure about
      operationId: resolve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resolution"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
  /api/v1/imports/{id}/mapping:
    put:
      tags:
      - Imports
      summary: Confirm how columns map to FOCUS fields
      operationId: mapping
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MappingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
  /api/v1/employees/{id}:
    get:
      tags:
      - Organisation
      summary: Get an employee
      operationId: employee
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    put:
      tags:
      - Organisation
      summary: Update an employee
      operationId: updateEmployee
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeDetails"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
  /api/v1/employees/{id}/dismissal:
    put:
      tags:
      - Organisation
      summary: Mark an employee as dismissed
      description: Idempotent.
      operationId: dismiss
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
  /api/v1/departments/{id}/head:
    put:
      tags:
      - Organisation
      summary: Set the head of a department
      description: The head decides on vacations. Null clears it.
      operationId: setHead
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentHead"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
  /api/v1/contracts/{id}:
    put:
      tags:
      - Software
      summary: Change a contract
      operationId: updateContract
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractDetails"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
  /api/v1/company:
    get:
      tags:
      - Organisation
      summary: Get the company of the current token
      operationId: company
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    put:
      tags:
      - Organisation
      summary: Create or update the company
      description: Idempotent.
      operationId: saveCompany
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettings"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /api/v1/budgets/{id}/limit:
    put:
      tags:
      - Ledger
      summary: Change a limit
      description: A limit below the spent amount is allowed.
      operationId: setLimit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitChange"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
  /api/v1/assets/{id}/retirement:
    put:
      tags:
      - Assets
      summary: Retire an asset that nobody holds
      description: Idempotent.
      operationId: retire
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemBody"
        "401":
          description: Missing or invalid token
        "403":
          description: "code: tenant_missing or role_required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemBody"
        "404":
          description: "code: asset_not_found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemBody"
        "409":
          description: "code: asset_already_assigned or asset_retired"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemBody"
  /api/v1/assets/{id}/assignment:
    put:
      tags:
      - Assets
      summary: Issue an asset to an employee or move its return date
      description: "Idempotent. A new issue makes its handover act (PDF), see actNumber;\
        \ moving the return date of the same holder makes none."
      operationId: assign
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAssignment"
        required: true
      responses:
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemBody"
        "401":
          description: Missing or invalid token
        "403":
          description: "code: tenant_missing or role_required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemBody"
        "404":
          description: "code: asset_not_found or employee_not_found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemBody"
        "409":
          description: "code: asset_already_assigned or asset_retired"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemBody"
    delete:
      tags:
      - Assets
      summary: Take an asset back from its holder
      description: Idempotent.
      operationId: takeBack
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemBody"
        "401":
          description: Missing or invalid token
        "403":
          description: "code: tenant_missing or role_required"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemBody"
        "404":
          description: "code: asset_not_found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemBody"
        "204":
          description: No Content
  /api/v1/approvals/{id}/decision:
    put:
      tags:
      - Approvals
      summary: Approve or reject
      description: A closed request answers 409.
      operationId: decide_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
  /api/v1/analytics/forecast:
    get:
      tags:
      - Analytics
      summary: "The newest forecast: the company, its departments, the registry baseline\
        \ and savings"
      description: Published by the forecast job (costguard-forecast); 404 forecast_not_found
        before the first.
      operationId: forecast
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedForecast"
    put:
      tags:
      - Analytics
      summary: Publish a forecast
      description: "The departments must add up to the company within a kopeck each,\
        \ every series must have horizon points: else 400 forecast_does_not_add_up.\
        \ Older forecasts are kept."
      operationId: publish
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastDocument"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedForecast"
  /api/v1/agents/{id}:
    get:
      tags:
      - Agents
      summary: Get an agent
      operationId: agent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    put:
      tags:
      - Agents
      summary: Update an agent
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDetails"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      tags:
      - Agents
      summary: Delete an agent and its keys
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/agents/{id}/suspension:
    put:
      tags:
      - Agents
      summary: Stop an agent
      description: Idempotent.
      operationId: suspend
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      tags:
      - Agents
      summary: Start a stopped agent
      description: Idempotent.
      operationId: resume
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /api/v1/vendors:
    get:
