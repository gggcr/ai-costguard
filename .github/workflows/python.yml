name: python
on:
  push:
    paths: ['apps/python/**', 'libs/python/**', 'schemas/**', 'infra/airflow/**', 'tools/**', 'tests/**', 'pyproject.toml', 'uv.lock']
  pull_request:
    paths: ['apps/python/**', 'libs/python/**', 'schemas/**', 'infra/airflow/**', 'tools/**', 'tests/**', 'pyproject.toml', 'uv.lock']
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
      # the row policies test must not skip here (ADR 0035)
      CLICKHOUSE_ACCESS_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      # schemas/clickhouse/tests run against it; without CLICKHOUSE_TEST_URL they are skipped. Started here and not as
      # a service: it needs the config of the checkout that lets the default user manage access (row policies).
      - name: ClickHouse
        run: |
          docker run -d --name clickhouse -p 8123:8123 -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            -v "$PWD/schemas/clickhouse/tests/users.d/access-management.xml:/etc/clickhouse-server/users.d/access-management.xml:ro" \
            clickhouse/clickhouse-server:24.8
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8123/ping && exit 0
            sleep 2
          done
          docker logs clickhouse
          exit 1
      - uses: astral-sh/setup-uv@v5
        with: { version: '0.5.11' }
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages
      - name: Tesseract for the OCR test of costguard-ingest, age for the ClickHouse backup drill
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng age
      - run: uv run ruff check .
      - name: Kafka contracts of the Python services (schemas/avro)
        run: uv run pytest tests/contracts
      - run: uv run pytest --ignore=tests/contracts
      - name: Seed SQL loads on the migrations
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=p -e POSTGRES_DB=costguard -p 5432:5432 postgres:17
          # The image first runs a temporary server on the Unix socket only, creates the database, then restarts;
          # pg_isready on the socket answers before costguard exists. Only the final server listens on TCP.
          for i in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres -d costguard && break
            sleep 1
          done
          docker exec pg psql -q -U postgres -d costguard -c 'select 1' > /dev/null
          for f in $(ls apps/backend/core/src/main/resources/db/migration/*.sql | sort -V); do
            docker exec -i pg psql -q -v ON_ERROR_STOP=1 -U postgres -d costguard < "$f"
          done
          python tools/seed/seed.py | docker exec -i pg psql -q -v ON_ERROR_STOP=1 -U postgres -d costguard
          python tools/seed/seed.py | docker exec -i pg psql -q -v ON_ERROR_STOP=1 -U postgres -d costguard
  backup-restore:
    # The PostgreSQL drill of tools/tests/test_backup.py (ADR 0025): migrations and the seed, a dump as the read-only
    # backup role, encrypted with age, restored into an empty database and compared table by table.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: p }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 30
    env:
      BACKUP_TEST_PG_ADMIN: postgresql://postgres:p@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: pg_dump 17 (the version of Managed PostgreSQL) and age
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v5
        with: { version: '0.5.11' }
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages
      - run: uv run pytest tools/tests/test_backup.py -v -p no:cacheprovider
  image:
    # Every Python service has its own image (apps/python/<service>/Dockerfile) with only its own package inside.
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: ingest, module: costguard_ingest }
          - { name: anomaly, module: costguard_anomaly }
          - { name: notary, module: costguard_notary }
          - { name: connectors, module: costguard_connectors }
          - { name: reports, module: costguard_reports }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/python/${{ matrix.service.name }}/Dockerfile -t costguard-${{ matrix.service.name }}:${{ github.sha }} .
      - run: docker run --rm costguard-${{ matrix.service.name }}:${{ github.sha }} python -c "import ${{ matrix.service.module }}; from costguard_common import schemas; assert schemas.topics()"
