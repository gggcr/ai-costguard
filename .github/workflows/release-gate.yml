name: release-gate
# tools/release/verify.sh as one script, on a clean machine with every tool it needs (docs/RELEASE_PROCESS.md):
# Java with the Docker tests, Python, the web client, generated API types, Helm, Terraform, audits and the SBOM.
# Started by hand before a release; it publishes nothing.
on:
  workflow_dispatch:

# The token of every job reads the code and nothing more
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { version: '0.5.11' }
      - run: uv python install 3.12 && uv sync --frozen --all-packages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: { version: v3.16.4 }
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: 1.9.8, terraform_wrapper: false }
      - name: Release gate
        run: tools/release/verify.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate
          path: |
            docs/sbom/
            apps/backend/*/build/reports/tests/
          if-no-files-found: ignore
