name: load
# The gateway under load (tests/load): thousands of reserves and settles a second against one agent with a hard
# limit. Started by hand only: it takes minutes and a whole runner.
on:
  workflow_dispatch:
    inputs:
      rate: { description: 'Operations a second', default: '2000', required: true }
      duration: { description: 'How long, k6 syntax', default: '60s', required: true }
      limit: { description: 'Hard limit of the agent, RUB', default: '500000', required: true }
      amount: { description: 'Reserve per operation, RUB', default: '10', required: true }
# The token of every job reads the code and nothing more
permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      SCHEMA_REGISTRY_URL: http://localhost:8085
      GATEWAY_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '25' }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: { version: '0.5.11' }
      - run: uv sync --frozen --all-packages
      - name: Redis, Kafka and the Schema Registry
        run: docker compose -f infra/local/docker-compose.yml up -d --wait redis kafka schema-registry
      - name: Gateway
        run: |
          ./gradlew :gateway:bootJar
          nohup java -jar apps/backend/gateway/build/libs/gateway.jar > gateway.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8081/actuator/health && break; sleep 2; done
      # The inputs go in through the environment, never spliced into the script (shell injection)
      - name: An agent with a hard limit
        env: { LIMIT: '${{ inputs.limit }}' }
        run: uv run python tests/load/load.py seed --limit "$LIMIT"
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1
      - name: k6
        env: { LIMIT: '${{ inputs.limit }}', AMOUNT: '${{ inputs.amount }}', RATE: '${{ inputs.rate }}', DURATION: '${{ inputs.duration }}' }
        run: >-
          k6 run --summary-export summary.json -e SECRET="$LOAD_SECRET" -e LIMIT="$LIMIT"
          -e AMOUNT="$AMOUNT" -e RATE="$RATE" -e DURATION="$DURATION"
          tests/load/spend.js
      - name: Spent plus reserved is within the limit in Redis
        if: always()
        run: uv run python tests/load/load.py check --summary summary.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: load-results
          path: |
            summary.json
            gateway.log
