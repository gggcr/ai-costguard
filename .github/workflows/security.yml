name: security
# Vulnerabilities in dependencies and images, and secrets in the code (ADR 0027). A critical vulnerability with a fix
# fails the build; HIGH and the rest go to the Security tab as SARIF. Every Monday the same checks run on goidochka, so a
# new CVE in a dependency nobody touched still turns up. Accepted exceptions: .trivyignore, with a reason and a date.
on:
  push:
    branches: [goidochka]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  TRIVY_IMAGE: aquasec/trivy:0.57.1
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2
  # Fail on these; report the rest.
  FAIL_ON: CRITICAL

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Secrets in the code and its history
        run: |
          # A pull request is checked commit by commit; goidochka and the weekly run check the whole history.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="--log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" detect --source /repo \
            --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 ${range:-}

  dependencies:
    # Python (uv.lock), JavaScript (package-lock.json) and Rust (Cargo.lock) from their lock files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report every finding to the Security tab
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" fs --scanners vuln --format sarif \
            --output /repo/deps.sarif --skip-dirs apps/frontend/node_modules --skip-dirs .venv /repo
      # The Security tab needs code scanning (GitHub Advanced Security on a private repository); without it the
      # upload is refused, and that must not stop the check that matters, «Fail on critical», below.
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        continue-on-error: true
        if: always() && hashFiles('deps.sarif') != ''
        with: { sarif_file: deps.sarif, category: dependencies }
      - name: Fail on critical
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" fs --scanners vuln --severity "$FAIL_ON" \
            --ignore-unfixed --ignorefile /repo/.trivyignore --exit-code 1 \
            --skip-dirs apps/frontend/node_modules --skip-dirs .venv /repo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      - name: npm audit of the frontend
        working-directory: apps/frontend
        run: npm audit --omit=dev --audit-level=critical

  java:
    # Gradle has no lock file Trivy reads, so the jars are scanned as built, with everything they bundle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew :core:bootJar :gateway:bootJar
      - name: Report every finding to the Security tab
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" rootfs --scanners vuln --format sarif \
            --output /repo/java.sarif /repo/apps/backend/core/build/libs /repo/apps/backend/gateway/build/libs || true
      # The Security tab needs code scanning (GitHub Advanced Security on a private repository); without it the
      # upload is refused, and that must not stop the check that matters, «Fail on critical», below.
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        continue-on-error: true
        if: always() && hashFiles('java.sarif') != ''
        with: { sarif_file: java.sarif, category: java }
      - name: Fail on critical
        run: |
          for jar in apps/backend/core/build/libs apps/backend/gateway/build/libs; do
            docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" rootfs --scanners vuln --severity "$FAIL_ON" \
              --ignore-unfixed --ignorefile /repo/.trivyignore --exit-code 1 "/repo/$jar"
          done

  images:
    # What runs in the cluster: the jars above plus the operating system of each image.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: core, context: apps/backend/core, dockerfile: apps/backend/core/Dockerfile, jar: core }
          - { name: gateway, context: apps/backend/gateway, dockerfile: apps/backend/gateway/Dockerfile, jar: gateway }
          # the web client: nginx and the built bundle, the only image the internet reaches directly
          - { name: frontend, context: apps/frontend, dockerfile: apps/frontend/Dockerfile }
          - { name: ingest, context: ., dockerfile: apps/python/ingest/Dockerfile }
          - { name: anomaly, context: ., dockerfile: apps/python/anomaly/Dockerfile }
          - { name: notary, context: ., dockerfile: apps/python/notary/Dockerfile }
          - { name: connectors, context: ., dockerfile: apps/python/connectors/Dockerfile }
          - { name: reports, context: ., dockerfile: apps/python/reports/Dockerfile }
          - { name: backup, context: ., dockerfile: deploy/backup/Dockerfile }
          - { name: mlflow, context: deploy/mlflow, dockerfile: deploy/mlflow/Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.image.jar
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: matrix.image.jar
      - if: matrix.image.jar
        run: ./gradlew :${{ matrix.image.jar }}:bootJar
      - run: docker build -f ${{ matrix.image.dockerfile }} -t costguard-${{ matrix.image.name }}:scan ${{ matrix.image.context }}
      - name: Report every finding to the Security tab
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" "$TRIVY_IMAGE" image \
            --scanners vuln --format sarif --output /repo/image.sarif costguard-${{ matrix.image.name }}:scan
      # The Security tab needs code scanning (GitHub Advanced Security on a private repository); without it the
      # upload is refused, and that must not stop the check that matters, «Fail on critical», below.
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        continue-on-error: true
        if: always() && hashFiles('image.sarif') != ''
        with: { sarif_file: image.sarif, category: 'image-${{ matrix.image.name }}' }
      - name: Fail on critical
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" "$TRIVY_IMAGE" image \
            --scanners vuln --severity "$FAIL_ON" --ignore-unfixed --ignorefile /repo/.trivyignore --exit-code 1 \
            costguard-${{ matrix.image.name }}:scan
