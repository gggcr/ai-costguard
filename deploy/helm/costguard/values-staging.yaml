image:
  tag: main
services:
  core: { replicas: 1 }
  gateway: { autoscaling: { minReplicas: 1, maxReplicas: 3, cpu: 80 } }
  ingest: { replicas: 1, keda: { maxReplicas: 3 } }
  notary:
    env:
      NEAR_RPC_URL: https://rpc.testnet.near.org
      NEAR_CONTRACT_ID: notary.costguard.testnet
connectorsCronJob:
  enabled: true
keda:
  enabled: true
mlflow:
  enabled: true
  artifactsBucket: costguard-staging-mlflow
# Switch on with the age public key and the backup user in the secret (docs/runbooks/backups.md).
backups:
  enabled: false
  bucket: costguard-staging-backups
  filesBucket: costguard-staging-imports
