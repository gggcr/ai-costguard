{{- /* MLflow tracking server and model registry (ADR 0017). Runs in PostgreSQL, artifacts in S3. */}}
{{- if .Values.mlflow.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: costguard-mlflow
  labels:
    {{- include "costguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: mlflow
spec:
  replicas: {{ .Values.mlflow.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: costguard
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: costguard
        app.kubernetes.io/name: mlflow
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mlflow
          image: {{ include "costguard.image" (dict "root" . "image" .Values.mlflow.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # --serve-artifacts: clients read and write artifacts through MLflow and need no S3 keys of their own
          args: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
                 "--backend-store-uri", "$(MLFLOW_BACKEND_STORE_URI)",
                 "--artifacts-destination", "s3://{{ .Values.mlflow.artifactsBucket }}", "--serve-artifacts"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: MLFLOW_BACKEND_STORE_URI } }
            - name: MLFLOW_S3_ENDPOINT_URL
              value: {{ .Values.external.s3Endpoint | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: S3_ACCESS_KEY } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: S3_SECRET_KEY } }
            - { name: HOME, value: /tmp }
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mlflow.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: costguard-mlflow
  labels:
    {{- include "costguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: mlflow
spec:
  selector:
    app.kubernetes.io/part-of: costguard
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
