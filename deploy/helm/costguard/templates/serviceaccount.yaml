{{- /*
The service account of the workloads (serviceAccount in values). On AWS its annotation eks.amazonaws.com/role-arn
gives the pods the IAM role deploy/terraform/aws creates (output workloads_role_arn): S3 without static keys.
*/}}
{{- if and .Values.serviceAccount.create .Values.serviceAccount.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "costguard.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
