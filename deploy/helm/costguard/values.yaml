# Images are built by CI (see .github/workflows) and tagged with the commit; set image.tag per environment.
image:
  registry: cr.yandex/costguard
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Managed services outside the cluster (deploy/terraform creates them). Secrets are not here: every service reads
# the Kubernetes secret named in `secretName` (create it from Lockbox or Vault, see docs/runbooks/secrets.md).
external:
  kafkaBootstrapServers: kafka:9092
  schemaRegistryUrl: http://schema-registry:8081
  postgresUrl: jdbc:postgresql://postgres:6432/costguard
  redisHost: redis
  clickhouseUrl: http://clickhouse:8123
  s3Endpoint: https://storage.yandexcloud.net
  keycloakIssuerUri: https://id.costguard.example/realms/costguard

secretName: costguard-secrets

# One entry per workload. `http` services get a Service, probes and metrics; the others are Kafka consumers.
services:
  core:
    enabled: true
    image: core
    replicas: 2
    http: { port: 8080 }
    probes: spring
    metrics: /actuator/prometheus
    resources: { requests: { cpu: 500m, memory: 768Mi }, limits: { memory: 1536Mi } }
    env:
      CORE_PORT: "8080"
      TRACE_SAMPLING: "0.1"
      # Approved operations of at least this many roubles are confirmed in NEAR (ADR 0009).
      COSTGUARD_NOTARY_CONFIRM_ABOVE: "100000"
  gateway:
    enabled: true
    image: gateway
    replicas: 3
    http: { port: 8081 }
    probes: spring
    metrics: /actuator/prometheus
    autoscaling: { minReplicas: 3, maxReplicas: 12, cpu: 70 }
    resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 1Gi } }
    env:
      GATEWAY_PORT: "8081"
      COMPANY_TIME_ZONE: Europe/Moscow
      # The AI assessor of step 6 (ADR 0011) is off until ASSESSOR_PROVIDER and ASSESSOR_MODEL are set, here or in
      # the secret. Do not set them empty here: env wins over the secret.
  ingest:
    enabled: true
    image: python
    command: [costguard-ingest]
    replicas: 2
    resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }
    # With keda.enabled, KEDA sets the replicas by the lag of the group; maxReplicas is at most the partitions.
    keda:
      consumerGroup: ingest-pipeline
      topics: [ingest.files.v1, ingest.accepted.v1]
      lagThreshold: 20
      minReplicas: 1
      maxReplicas: 6
  anomaly:
    enabled: true
    image: python
    command: [costguard-anomaly]
    # It keeps its history in memory and reads the topic from the start: one replica per tenant set. Not scaled by
    # KEDA: two copies would each publish every finding and signal.
    replicas: 1
    resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 2Gi } }
  notary:
    enabled: true
    image: python
    command: [costguard-notary]
    # Not scaled by KEDA: every copy would sign with the same NEAR key, and their nonces would collide.
    replicas: 1
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
    env:
      NEAR_RPC_URL: https://rpc.mainnet.near.org
      NEAR_CONTRACT_ID: notary.costguard.near

# KEDA (keda.sh) scales the Kafka workers that have a `keda` entry by the lag of their consumer group (ADR 0017).
# The KEDA operator must be installed in the cluster. Without keda.enabled those workers keep their `replicas`.
keda:
  enabled: false
  pollingInterval: 15
  cooldownPeriod: 300
  # When Kafka asks for SASL: a TriggerAuthentication from the keys KEDA_KAFKA_SASL (plaintext, scram_sha256 or
  # scram_sha512), KEDA_KAFKA_USERNAME, KAFKA_PASSWORD and KEDA_KAFKA_TLS (enable) of the secret.
  kafkaAuth: false

# MLflow: models of the anomaly detector and of the forecasts (ADR 0016, ADR 0017). Runs are kept in PostgreSQL
# (the secret's MLFLOW_BACKEND_STORE_URI), artifacts in S3 (`artifactsBucket` at external.s3Endpoint), served by
# MLflow itself, so services need no S3 keys. Services get MLFLOW_TRACKING_URI when it is enabled.
mlflow:
  enabled: false
  image: mlflow                  # deploy/mlflow/Dockerfile, built with the other images
  replicas: 1
  artifactsBucket: costguard-mlflow
  resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1Gi } }

# Connectors run on Airflow (infra/airflow) or as a CronJob here, one per tenant config in the secret.
connectorsCronJob:
  enabled: false
  schedule: "0 * * * *"
  configSecret: costguard-tenants

clickhouseMigrations:
  enabled: true

monitoring:
  serviceMonitor: true
  rules: true
  dashboard: true
  # Alert thresholds
  gatewayP99Seconds: 0.25
  consumerLagMessages: 10000
