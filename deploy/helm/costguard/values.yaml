# Images are built by CI (see .github/workflows) and tagged with the commit; set image.tag per environment.
image:
  registry: cr.yandex/costguard
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# The region every store lives in (ADR 0024): the same as `region` of deploy/terraform/yandex, which places the
# managed services there. The S3 endpoint and the signing region of S3 clients follow from it; an unknown region
# fails the render. Personal data must not leave it: see docs/privacy/data-inventory.md.
region: ru-central1
regions:
  ru-central1:
    s3Endpoint: https://storage.yandexcloud.net
  # AWS (deploy/terraform/aws): the US and EU regions the Terraform module allows
  us-east-1:
    s3Endpoint: https://s3.us-east-1.amazonaws.com
  us-east-2:
    s3Endpoint: https://s3.us-east-2.amazonaws.com
  us-west-2:
    s3Endpoint: https://s3.us-west-2.amazonaws.com
  eu-central-1:
    s3Endpoint: https://s3.eu-central-1.amazonaws.com
  eu-west-1:
    s3Endpoint: https://s3.eu-west-1.amazonaws.com
  eu-north-1:
    s3Endpoint: https://s3.eu-north-1.amazonaws.com

# The Kubernetes service account of the workloads. Empty name: the namespace's default account. On AWS set
# create: true, a name, and the annotation eks.amazonaws.com/role-arn with terraform output workloads_role_arn, and
# leave S3_ACCESS_KEY and S3_SECRET_KEY out of the secret: the pods then use the IAM role.
serviceAccount:
  create: false
  name: ""
  annotations: {}

# Managed services outside the cluster (deploy/terraform creates them). Secrets are not here: every service reads
# the Kubernetes secret named in `secretName` (create it from Lockbox or Vault, see docs/runbooks/secrets.md).
# Keycloak is not created by deploy/terraform: with keycloak.enabled the chart runs it (ADR 0035), otherwise it must
# run elsewhere in `region` as well (docs/runbooks/privacy.md). With keycloak.enabled the two Keycloak addresses below
# are not read: they follow from ingress.hosts.keycloak.
external:
  kafkaBootstrapServers: kafka:9092
  schemaRegistryUrl: http://schema-registry:8081
  postgresUrl: jdbc:postgresql://postgres:6432/costguard
  redisHost: redis
  clickhouseUrl: http://clickhouse:8123
  # Empty: the endpoint of `region`. Set it only for an S3 in the same region under another name.
  s3Endpoint: ""
  keycloakIssuerUri: https://id.costguard.example/realms/costguard
  # The admin API the core deletes accounts through when it erases a person or a company (ADR 0021).
  keycloakAdminUrl: https://id.costguard.example

secretName: costguard-secrets

# Spring services serve /actuator (health, metrics) on this port: probes and Prometheus use it inside the cluster,
# the ingress publishes only the http port.
managementPort: 9090

# One entry per workload. `http` services get a Service, probes and metrics; the others are Kafka consumers.
# `plain` services get neither the secret nor the shared environment (the web client needs none of it); `writable`
# lists the directories they write to under a read-only root. Values of `env` may use templates ({{ .Release.Namespace }}).
services:
  frontend:
    enabled: true
    image: frontend
    replicas: 2
    plain: true
    http: { port: 3000 }
    probes: http
    writable: [/etc/nginx/conf.d]
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
    env:
      # nginx resolves the core itself and does not use the search domains of the pod: the full name
      CORE_URL: "http://costguard-core.{{ .Release.Namespace }}.svc.cluster.local"
      NGINX_RESOLVER: kube-dns.kube-system.svc.cluster.local
  core:
    enabled: true
    image: core
    replicas: 2
    http: { port: 8080 }
    probes: spring
    metrics: /actuator/prometheus
    resources: { requests: { cpu: 500m, memory: 768Mi }, limits: { memory: 1536Mi } }
    env:
      CORE_PORT: "8080"
      TRACE_SAMPLING: "0.1"
      # Approved operations of at least this many roubles are confirmed in NEAR (ADR 0009).
      COSTGUARD_NOTARY_CONFIRM_ABOVE: "100000"
      # Notifications to people (ADR 0031): put SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
      # SPRING_MAIL_PASSWORD, MAIL_FROM and TELEGRAM_BOT_TOKEN in the secret; a channel without them stays off.
      # WEB_URL: where links in e-mail and Telegram lead, e.g. https://costguard.example.ru
      # Self-registration and invitations (ADR 0036): KEYCLOAK_REGISTRATION_CLIENT_SECRET in the secret; without it
      # registration answers 503. Payments (ADR 0038): PAYMENT_PROVIDER stays unset until a provider is chosen;
      # never dummy here, it gives plans away. Stripe (ADR 0077): PAYMENT_PROVIDER=stripe here, STRIPE_SECRET_KEY,
      # STRIPE_WEBHOOK_SECRET and STRIPE_PRICE_* in the secret (docs/STRIPE_SETUP.md).
  gateway:
    enabled: true
    image: gateway
    replicas: 3
    http: { port: 8081 }
    probes: spring
    metrics: /actuator/prometheus
    autoscaling: { minReplicas: 3, maxReplicas: 12, cpu: 70 }
    resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 1Gi } }
    env:
      GATEWAY_PORT: "8081"
      COMPANY_TIME_ZONE: Europe/Moscow
      # The AI assessor of step 6 (ADR 0011) is off until ASSESSOR_PROVIDER and ASSESSOR_MODEL are set, here or in
      # the secret. Do not set them empty here: env wins over the secret.
  ingest:
    enabled: true
    image: ingest           # apps/python/ingest/Dockerfile
    command: [costguard-ingest]
    replicas: 2
    resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }
    # With keda.enabled, KEDA sets the replicas by the lag of the group; maxReplicas is at most the partitions.
    keda:
      consumerGroup: ingest-pipeline
      topics: [ingest.files.v1, ingest.accepted.v1]
      lagThreshold: 20
      minReplicas: 1
      maxReplicas: 6
  anomaly:
    enabled: true
    image: anomaly           # apps/python/anomaly/Dockerfile
    command: [costguard-anomaly]
    # It keeps its history in memory and reads the topic from the start: one replica per tenant set. Not scaled by
    # KEDA: two copies would each publish every finding and signal.
    replicas: 1
    resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 2Gi } }
  notary:
    enabled: true
    image: notary           # apps/python/notary/Dockerfile
    command: [costguard-notary]
    # Not scaled by KEDA: every copy would sign with the same NEAR key, and their nonces would collide.
    replicas: 1
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
    env:
      NEAR_RPC_URL: https://rpc.mainnet.near.org
      NEAR_CONTRACT_ID: notary.costguard.near

# Ingress (ADR 0035): the web client, the core's API for connectors and scripts, the agent gateway and, with
# keycloak.enabled, Keycloak, each on its own host, over TLS. Needs an ingress controller (ingress-nginx by default)
# and, for certificates, cert-manager with the ClusterIssuer `clusterIssuer`; without one, the secret `tlsSecret`
# must hold a certificate for every host.
ingress:
  enabled: false
  className: nginx
  clusterIssuer: letsencrypt
  tlsSecret: costguard-tls
  hosts:
    web: costguard.example.ru
    api: api.costguard.example.ru
    gateway: gateway.costguard.example.ru
    keycloak: id.costguard.example.ru
  # Uploads of invoices and statements go through the web client's /api
  maxBodySize: 50m
  # Agents stream answers of models through the gateway
  gatewayReadTimeoutSeconds: 600
  # Requests per second from one client address to the web client, the API and Keycloak (ingress-nginx), with
  # bursts of five times that; 0 turns it off. The gateway is limited per agent instead.
  rateLimitRps: 20

# Keycloak in the cluster (ADR 0035): Keycloak 26 on its own PostgreSQL database, behind the ingress on
# ingress.hosts.keycloak. On the first start it imports the realm files/keycloak-realm.json (the roles and clients of
# the realm of the local stack without what only that stack needs); a realm that exists is kept. The
# secret `secretName` holds KC_DB_URL, KC_DB_USERNAME, KC_DB_PASSWORD, KC_BOOTSTRAP_ADMIN_USERNAME,
# KC_BOOTSTRAP_ADMIN_PASSWORD, KEYCLOAK_PRIVACY_CLIENT_SECRET and KEYCLOAK_REGISTRATION_CLIENT_SECRET
# (docs/runbooks/keycloak.md). Replicas share their
# sessions over the headless service (Infinispan, DNS discovery).
keycloak:
  enabled: false
  image: quay.io/keycloak/keycloak:26.0.7
  replicas: 2
  realm: costguard
  secretName: costguard-keycloak
  resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 2Gi } }

# KEDA (keda.sh) scales the Kafka workers that have a `keda` entry by the lag of their consumer group (ADR 0017).
# The KEDA operator must be installed in the cluster. Without keda.enabled those workers keep their `replicas`.
keda:
  enabled: false
  pollingInterval: 15
  cooldownPeriod: 300
  # When Kafka asks for SASL: a TriggerAuthentication from the keys KEDA_KAFKA_SASL (plaintext, scram_sha256 or
  # scram_sha512), KEDA_KAFKA_USERNAME, KAFKA_PASSWORD and KEDA_KAFKA_TLS (enable) of the secret.
  kafkaAuth: false

# MLflow: models of the anomaly detector and of the forecasts (ADR 0016, ADR 0017). Runs are kept in PostgreSQL
# (the secret's MLFLOW_BACKEND_STORE_URI), artifacts in S3 (`artifactsBucket` at external.s3Endpoint), served by
# MLflow itself, so services need no S3 keys. Services get MLFLOW_TRACKING_URI when it is enabled.
mlflow:
  enabled: false
  image: mlflow                  # deploy/mlflow/Dockerfile, built with the other images
  replicas: 1
  artifactsBucket: costguard-mlflow
  resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1Gi } }

# Connectors run on Airflow (infra/airflow) or as a CronJob here, one per tenant config in the secret.
connectorsCronJob:
  enabled: false
  schedule: "0 * * * *"
  configSecret: costguard-tenants

clickhouseMigrations:
  enabled: true
  # Row policies of schemas/clickhouse/access (ADR 0035): a reader of one company sees that company only. The job's
  # user must manage access, which a managed ClickHouse allows only with SQL user management, a switch that cannot be
  # undone; CLICKHOUSE_READER_PASSWORD must be in the secret. The reports and forecast jobs then connect as
  # costguard_reader with CLICKHOUSE_TENANT_SETTING=1 (docs/runbooks/clickhouse-access.md).
  rowPolicies: false

monitoring:
  serviceMonitor: true
  rules: true
  dashboard: true
  # Every alert links its runbook here (ADR 0026); docs/runbooks/<file> is appended.
  runbookBaseUrl: https://github.com/gggcr/ai-costguard/blob/main/docs/runbooks
  # Alert thresholds
  gatewayP99Seconds: 0.25
  consumerLagMessages: 10000
  outboxOldestSeconds: 900
  diskFreeRatio: 0.15
  connectorFailureRatio: 0.5

# Logs (ADR 0035): Loki and Grafana Alloy run in the namespace observability (deploy/argocd/observability.yaml).
# With logging.enabled the chart adds Loki as a data source of the Grafana of kube-prometheus-stack, whose sidecar
# picks up ConfigMaps labelled grafana_datasource.
logging:
  enabled: false
  lokiUrl: http://loki-gateway.observability.svc.cluster.local

# Uploaded files (ADR 0049): the bucket of `terraform output imports_bucket`, costguard-<environment>-imports. The
# core writes every upload there and the ingest pipeline reads it from there; both use S3_ACCESS_KEY and
# S3_SECRET_KEY of the secret. Without it the core would keep files on the disk of its pod, which ingest never sees.
imports:
  bucket: costguard-imports

# Traces (ADR 0048, 0050): the core, the gateway and the Python services send spans over OTLP to the OpenTelemetry Collector of
# deploy/argocd/observability.yaml, which forwards them to Tempo; Grafana shows them next to the logs. Off, the
# services still put a trace id into errors and logs, but export nothing. TRACE_SAMPLING of the core sets the share.
tracing:
  enabled: false
  otlpEndpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces

# Delivery of alerts (ADR 0026): an AlertmanagerConfig for the Alertmanager of kube-prometheus-stack. Warnings go
# to Telegram, critical alerts to Telegram and e-mail. The secret `secretName` holds TELEGRAM_BOT_TOKEN and
# SMTP_PASSWORD; create it before switching this on (docs/runbooks/alerting.md).
alerting:
  enabled: false
  secretName: costguard-alerting
  # Labels the Alertmanager's alertmanagerConfigSelector matches.
  selectorLabels: { alertmanagerConfig: costguard }
  telegram:
    chatId: 0
  email:
    to: ""
    from: ""
    smarthost: ""          # host:port of the SMTP server
    username: ""
  repeatInterval: 4h

# Nightly backups (ADR 0025): CronJobs of the image deploy/backup. Copies are encrypted to `ageRecipient`, an age
# public key whose private half is kept outside the cluster. Needs BACKUP_DB_USER and BACKUP_DB_PASSWORD in the
# secret (terraform output). Off until the age key exists (docs/runbooks/backups.md).
backups:
  enabled: false
  image: backup
  bucket: ""               # terraform output backups_bucket
  filesBucket: ""          # terraform output imports_bucket
  ageRecipient: ""         # age1...
  schedules:
    postgres: "0 1 * * *"
    clickhouse: "30 1 * * *"
    files: "0 2 * * *"
  deadlineSeconds: 14400
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  # Room for one dump on its way to the bucket.
  scratchSize: 20Gi

# Restarts the services when costguard-secrets changes, so a rotated secret takes effect without a manual rollout
# (ADR 0028). Needs Stakater Reloader in the cluster; without it the annotation does nothing.
reloadOnSecretChange: true
