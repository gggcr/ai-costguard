# The tag is set by the release pipeline (deploy/argocd/prod.yaml points at a git tag).
image:
  tag: "0.1.0"
keda:
  enabled: true
mlflow:
  enabled: true
  artifactsBucket: costguard-prod-mlflow
# Switch on with the age public key and the backup user in the secret (docs/runbooks/backups.md).
backups:
  enabled: false
  bucket: costguard-prod-backups
  filesBucket: costguard-prod-imports
# terraform output imports_bucket (ADR 0049); backups.filesBucket copies the same bucket
imports:
  bucket: costguard-prod-imports
