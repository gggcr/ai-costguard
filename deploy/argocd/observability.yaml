# Observability of CostGuard (ADR 0035, ADR 0048), everything in the namespace observability:
# - kube-prometheus-stack: Prometheus, Alertmanager and Grafana. Prometheus picks up the ServiceMonitors and
#   PrometheusRules of the CostGuard chart (monitoring.*), Alertmanager its AlertmanagerConfig (alerting.*), Grafana
#   its dashboard and data sources through the sidecars (labels grafana_dashboard, grafana_datasource).
# - Loki and Grafana Alloy: logs. Alloy reads the logs of the pods of costguard and costguard-staging, takes the
#   level out of every line, and pushes them to Loki; Loki keeps them in the logs bucket of the region
#   (deploy/terraform/yandex, output logs_bucket) for 30 days.
# - OpenTelemetry Collector and Tempo: traces of the core and the gateway (tracing.enabled of the chart). The
#   collector config is infra/observability/otel-collector.yaml.
#
# Secrets in the namespace observability, created before the first sync (docs/runbooks/observability.md):
# loki-s3 with S3_ACCESS_KEY and S3_SECRET_KEY of the storage service account (terraform output secrets), and
# grafana-admin with admin-user and admin-password. Services mask personal data before they log (ADR 0023).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: Metrics, alerts, logs and traces of the CostGuard platform
  sourceRepos:
    - https://grafana.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
  destinations:
    - { server: https://kubernetes.default.svc, namespace: observability }
    # kube-prometheus-stack puts the kubelet Service there
    - { server: https://kubernetes.default.svc, namespace: kube-system }
  # Alloy and Prometheus read across namespaces (ClusterRole); the Prometheus operator brings its CRDs and webhooks
  clusterResourceWhitelist:
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.21.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig: { replication_factor: 1 }
          schemaConfig:
            configs:
              - from: "2026-11-01"
                store: tsdb
                object_store: s3
                schema: v13
                index: { prefix: index_, period: 24h }
          storage:
            type: s3
            bucketNames: { chunks: costguard-prod-logs, ruler: costguard-prod-logs, admin: costguard-prod-logs }
            s3:
              # the region of every store (ADR 0024); tools/tests/test_observability.py checks it against terraform
              endpoint: storage.yandexcloud.net
              region: ru-central1
              s3ForcePathStyle: true
              accessKeyId: ${S3_ACCESS_KEY}
              secretAccessKey: ${S3_SECRET_KEY}
          limits_config:
            retention_period: 720h
            # a line longer than this is cut: a stack trace stays whole, a dumped request does not
            max_line_size: 256KB
          compactor:
            retention_enabled: true
            delete_request_store: s3
        singleBinary:
          replicas: 1
          extraArgs: [-config.expand-env=true]
          extraEnvFrom:
            - secretRef: { name: loki-s3 }
          persistence: { size: 20Gi }
        read: { replicas: 0 }
        write: { replicas: 0 }
        backend: { replicas: 0 }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 0.10.1
    helm:
      valuesObject:
        controller: { type: daemonset }
        alloy:
          mounts: { varlog: false }
          configMap:
            content: |
              // Only CostGuard pods: the label every workload of the chart carries
              discovery.kubernetes "pods" {
                role = "pod"
                namespaces {
                  names = ["costguard", "costguard-staging"]
                }
              }

              discovery.relabel "costguard" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_part_of"]
                  regex         = "costguard"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
              }

              loki.source.kubernetes "costguard" {
                targets    = discovery.relabel.costguard.output
                forward_to = [loki.process.costguard.receiver]
              }

              // The level is the first word after the time: Spring Boot writes "2026-11-10T17:54:31.754+03:00 ERROR",
              // costguard_common.logs "2026-11-10 17:54:31,754 ERROR". It becomes a label; the rest stays text.
              loki.process "costguard" {
                stage.regex {
                  expression = "^\\S+(?:\\s\\d{2}:\\d{2}:\\d{2}\\S*)?\\s+(?P<level>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|CRITICAL)\\s"
                }
                stage.labels {
                  values = { level = "" }
                }
                forward_to = [loki.write.loki.receiver]
              }

              loki.write "loki" {
                endpoint {
                  url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: observability
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 66.3.1
    helm:
      valuesObject:
        # Managed Kubernetes: the control plane is not ours to scrape
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeEtcd: { enabled: false }
        kubeProxy: { enabled: false }
        prometheus:
          prometheusSpec:
            # take the ServiceMonitors and rules of every release, not only of this one
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: [ReadWriteOnce]
                  resources: { requests: { storage: 50Gi } }
        alertmanager:
          alertmanagerSpec:
            # alerting.selectorLabels of the CostGuard chart
            alertmanagerConfigSelector:
              matchLabels: { alertmanagerConfig: costguard }
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          sidecar:
            dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: ALL }
            datasources: { enabled: true, label: grafana_datasource, searchNamespace: ALL }
          additionalDataSources:
            - name: Tempo
              uid: costguard-tempo
              type: tempo
              access: proxy
              url: http://tempo.observability.svc.cluster.local:3100
              jsonData:
                # from a span to the log lines around it (logging.enabled of the CostGuard chart)
                tracesToLogsV2: { datasourceUid: costguard-loki, spanStartTimeShift: -5m, spanEndTimeShift: 5m }
                serviceMap: { datasourceUid: prometheus }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # the CRDs of the operator are too large for a client-side apply
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: observability
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.14.0
    helm:
      valuesObject:
        tempo:
          # a week of traces is enough to explain an incident; metrics and logs keep the longer history
          retention: 168h
          receivers:
            otlp:
              protocols:
                grpc: { endpoint: 0.0.0.0:4317 }
        persistence: { enabled: true, size: 20Gi }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: observability
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.110.0
    helm:
      valuesObject:
        mode: deployment
        replicaCount: 2
        image: { repository: otel/opentelemetry-collector-contrib }
        fullnameOverride: otel-collector
        extraEnvs:
          - { name: TEMPO_OTLP_ENDPOINT, value: "tempo.observability.svc.cluster.local:4317" }
        resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
        ports:
          jaeger-compact: { enabled: false }
          jaeger-thrift: { enabled: false }
          jaeger-grpc: { enabled: false }
          zipkin: { enabled: false }
        # replaces the default config of the chart: infra/observability/otel-collector.yaml without its comments
        alternateConfig:
          receivers:
            otlp:
              protocols:
                grpc: { endpoint: 0.0.0.0:4317 }
                http: { endpoint: 0.0.0.0:4318 }
          processors:
            memory_limiter:
              check_interval: 1s
              limit_percentage: 80
              spike_limit_percentage: 25
            batch: {}
            # Spans carry no personal data (ADR 0023): drop the attributes that could, whatever an instrumentation adds.
            attributes/personal-data:
              actions:
                - { key: enduser.id, action: delete }
                - { key: user.email, action: delete }
                - { key: http.request.header.authorization, action: delete }
                - { key: url.query, action: delete }
          exporters:
            otlp/tempo:
              endpoint: ${env:TEMPO_OTLP_ENDPOINT}
              tls: { insecure: true }
          extensions:
            health_check: { endpoint: 0.0.0.0:13133 }
          service:
            extensions: [health_check]
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, attributes/personal-data, batch]
                exporters: [otlp/tempo]
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
