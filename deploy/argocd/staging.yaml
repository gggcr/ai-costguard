# Staging follows main and syncs on its own.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: costguard-staging
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: costguard
  source:
    repoURL: https://git.costguard.example/costguard/costguard.git
    targetRevision: main
    path: deploy/helm/costguard
    helm:
      valueFiles: [values.yaml, values-staging.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: costguard-staging
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }
