# Included by nginx.conf.template in the server and in every location with its own add_header.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Scripts only from this origin (the build has no inline script and no eval), no plugins, no framing, forms post
# only here. Requests (fetch, the event stream) go only to this origin, Keycloak and the API when it lives elsewhere:
# $csp_connect comes from csp-connect.conf, made at build time from the addresses baked into the bundle.
add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src $csp_connect" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
