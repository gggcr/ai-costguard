[project]
name = "costguard-reports"
version = "0.1.0"
description = "Spend forecasts and XLSX/PDF reports"
requires-python = ">=3.12"
dependencies = ["costguard-common", "httpx>=0.27", "openpyxl>=3.1", "fpdf2>=2.8"]

[project.scripts]
costguard-report = "costguard_reports.cli:main"
costguard-forecast = "costguard_reports.publish:main"

[tool.uv.sources]
costguard-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costguard_reports"]
