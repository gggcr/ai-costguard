[project]
name = "costguard-anomaly"
version = "0.1.0"
description = "Anomaly detector: spend spikes and double charges in cost.records.v1 (findings.v1), and the risk of agents from agent.operations.v1 (agent.risk-signals.v1)"
requires-python = ">=3.12"
dependencies = ["costguard-common", "confluent-kafka>=2.6", "scikit-learn>=1.5", "river>=0.22", "mlflow-skinny>=2.17", "tzdata>=2024.1"]

[project.scripts]
costguard-anomaly = "costguard_anomaly.service:main"

[tool.uv.sources]
costguard-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costguard_anomaly"]
