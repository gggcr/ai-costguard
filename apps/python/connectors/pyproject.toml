[project]
name = "costguard-connectors"
version = "0.1.0"
description = "Connectors to 1C, МойСклад, Bitrix24, Яндекс 360 and a mailbox; also runs as an agent inside the client's network"
requires-python = ">=3.12"
dependencies = ["costguard-common", "httpx>=0.27", "confluent-kafka>=2.6"]

[project.scripts]
costguard-connector-agent = "costguard_connectors.agent:main"

[tool.uv.sources]
costguard-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costguard_connectors"]
