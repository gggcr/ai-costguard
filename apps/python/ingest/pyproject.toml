[project]
name = "costguard-ingest"
version = "0.1.0"
description = "Ingest pipeline: reads uploaded invoices and exports, suggests the column mapping, writes FOCUS cost records"
requires-python = ">=3.12"
dependencies = [
    "costguard-common",
    "confluent-kafka>=2.6",
    "openpyxl>=3.1",
    "boto3>=1.35",
    "pdfplumber>=0.11",
]

[project.scripts]
costguard-ingest = "costguard_ingest.service:main"
costguard-focus-pull = "costguard_ingest.bucket:main"

[tool.uv.sources]
costguard-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costguard_ingest"]
