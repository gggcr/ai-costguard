server:
  port: ${CORE_PORT:8080}

spring:
  application:
    name: core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/costguard}
    username: ${DB_USER:costguard}
    password: ${DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/costguard}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
