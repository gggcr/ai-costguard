server:
  port: ${CORE_PORT:8080}
  # The client address behind the ingress (registration rate limits, ADR 0036). Tomcat trusts it only from
  # internal proxy addresses.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: core
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/costguard}
    username: ${DB_USER:costguard}
    password: ${DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/costguard}
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      # A published event is a copy of the change, personal data included (ADR 0021): delete it once delivered.
      completion-mode: delete
      jdbc:
        schema-initialization:
          enabled: true
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}

costguard:
  events:
    kafka:
      enabled: ${CORE_EVENTS_KAFKA_ENABLED:true}
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
  catalog:
    cbr:
      enabled: ${CBR_RATES_ENABLED:true}
  journal:
    private-key: ${JOURNAL_PRIVATE_KEY:}
    public-key: ${JOURNAL_PUBLIC_KEY:}
    # Public keys of rotated signing keys, base64 X.509, comma-separated: old receipts still verify (ADR 0028).
    previous-public-keys: ${JOURNAL_PREVIOUS_PUBLIC_KEYS:}
  connections:
    # base64 of 32 random bytes (openssl rand -base64 32), kept forever: it encrypts the secrets a company chose to
    # keep in the core (ADR 0030). Empty: such secrets are refused and stay in the agent's environment.
    encryption-key: ${CONNECTIONS_ENCRYPTION_KEY:}
    # «Синхронизировать сейчас» starts the Airflow DAG costguard_connector_sync; empty: the next hourly round pulls it
    airflow:
      url: ${AIRFLOW_URL:}
      username: ${AIRFLOW_USERNAME:}
      password: ${AIRFLOW_PASSWORD:}
      dag: ${AIRFLOW_CONNECTOR_SYNC_DAG:costguard_connector_sync}
  notary:
    # An approved operation of at least this amount (RUB) is confirmed in NEAR (ADR 0009).
    confirm-above: ${COSTGUARD_NOTARY_CONFIRM_ABOVE:100000}
  # Retention and erasure of personal data (ADR 0021, docs/privacy/data-inventory.md). The terms are the defaults
  # agreed for the lawyer to confirm; ISO-8601 periods.
  privacy:
    retention:
      enabled: ${PRIVACY_RETENTION_ENABLED:true}
      cron: ${PRIVACY_RETENTION_CRON:0 30 3 * * *}
      dismissed-employees: ${PRIVACY_RETAIN_DISMISSED_EMPLOYEES:P1Y}
      activity: ${PRIVACY_RETAIN_ACTIVITY:P1Y}
      notifications: ${PRIVACY_RETAIN_NOTIFICATIONS:P1Y}
      handover-acts: ${PRIVACY_RETAIN_HANDOVER_ACTS:P5Y}
      import-files: ${PRIVACY_RETAIN_IMPORT_FILES:P5Y}
      action-log: ${PRIVACY_RETAIN_ACTION_LOG:P3Y}
    company-grace: ${PRIVACY_COMPANY_GRACE:P30D}
    kafka-retention: P7D
    log-retention: P30D
    keycloak:
      url: ${KEYCLOAK_ADMIN_URL:http://localhost:8180}
      realm: ${KEYCLOAK_REALM:costguard}
      client-id: costguard-privacy
      # Off while empty: an erasure then lists the Keycloak account as a step for a person.
      client-secret: ${KEYCLOAK_PRIVACY_CLIENT_SECRET:}
    clickhouse-tables: cost_records,agent_operations
  # The analytics store: budget reconciliation reads it (ADR 0026), erasing a company deletes from it (ADR 0021).
  # Off while empty: reconciliation then does not run, and an erasure lists ClickHouse as a step for a person.
  clickhouse:
    url: ${CLICKHOUSE_URL:}
    database: ${CLICKHOUSE_DATABASE:costguard}
    user: ${CLICKHOUSE_USER:costguard}
    password: ${CLICKHOUSE_PASSWORD:}
  # E-mail and Telegram (ADR 0031). E-mail goes out when SPRING_MAIL_HOST (and SPRING_MAIL_PORT, _USERNAME,
  # _PASSWORD) and MAIL_FROM are set; Telegram when TELEGRAM_BOT_TOKEN is. Links in messages point to WEB_URL.
  notifications:
    web-url: ${WEB_URL:http://localhost:3000}
    mail-from: ${MAIL_FROM:}
    max-attempts: ${NOTIFICATIONS_MAX_ATTEMPTS:8}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      bot-username: ${TELEGRAM_BOT_USERNAME:}
      api-url: ${TELEGRAM_API_URL:https://api.telegram.org}

  # Self-registration and invitations (ADR 0036). Accounts are created in Keycloak as the confidential client
  # costguard-registration; off while its secret is empty: registration then answers 503 registration_unavailable.
  registration:
    keycloak:
      url: ${KEYCLOAK_ADMIN_URL:http://localhost:8180}
      realm: ${KEYCLOAK_REALM:costguard}
      client-id: costguard-registration
      client-secret: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:}
      # The client and the page Keycloak returns people to after they confirm the e-mail and set a password.
      login-client-id: costguard-frontend
      redirect-uri: ${WEB_URL:http://localhost:3000}
    # How long the link in the e-mail works, and how long an unconfirmed registration is kept before it is deleted.
    link-lifespan: ${REGISTRATION_LINK_LIFESPAN:PT24H}
    unconfirmed-for: ${REGISTRATION_UNCONFIRMED_FOR:PT48H}
    sweep-delay: PT15M
    # Abuse prevention: attempts per client IP address and per e-mail in a sliding window, kept in PostgreSQL.
    rate-limit:
      per-ip: ${REGISTRATION_LIMIT_PER_IP:5}
      per-email: ${REGISTRATION_LIMIT_PER_EMAIL:3}
      window: ${REGISTRATION_LIMIT_WINDOW:PT1H}
  # Pricing plans (ADR 0037). The limits and prices below are placeholders for the product owner to set; an empty
  # limit is no limit. Any value can be overridden from the environment by its relaxed name, e.g.
  # COSTGUARD_PLANS_CATALOG_START_LIMITS_AGENTS=20.
  plans:
    trial-length: ${PLAN_TRIAL_LENGTH:P14D}
    warn-before: ${PLAN_WARN_BEFORE:P3D}
    paid-period: P1M
    watch-delay: PT15M
    payments:
      # Empty: no payments (checkout answers 503). dummy: every payment succeeds at once, local stack only (ADR 0038).
      provider: ${PAYMENT_PROVIDER:}
      return-url: ${WEB_URL:http://localhost:3000}/settings/plan
    catalog:
      trial:
        title: Trial
        limits:
          agents: 3
          employees: 25
          connected-systems: 2
          operations-per-month: 10000
      start:
        title: Start
        monthly-price: 4990
        currency: RUB
        limits:
          agents: 10
          employees: 100
          connected-systems: 5
          operations-per-month: 100000
      business:
        title: Business
        monthly-price: 19990
        currency: RUB
        limits:
          agents: 50
          employees: 1000
          connected-systems: 25
          operations-per-month: 1000000

springdoc:
  default-produces-media-type: application/json

management:
  # Metrics are scraped by Prometheus (/actuator/prometheus); the OTLP push of spring-boot-starter-opentelemetry
  # would only fail every minute against a collector that takes traces, not metrics (ADR 0048).
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
