server:
  port: ${GATEWAY_PORT:8081}

spring:
  application:
    name: gateway
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Managed Redis has a password (terraform output secrets, REDIS_PASSWORD); empty locally means no AUTH.
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

costguard:
  gateway:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
    time-zone: ${COMPANY_TIME_ZONE:Europe/Moscow}
    # The AI assessor of step 6 (ADR 0011). Off unless both are set; then a model of one of the providers below
    # checks operations above the mandate threshold against the goal of the task.
    assessor:
      provider: ${ASSESSOR_PROVIDER:}
      model: ${ASSESSOR_MODEL:}
      timeout: ${ASSESSOR_TIMEOUT:PT3S}
    default-max-tokens: 1024
    providers:
      openai:
        url: https://api.openai.com
        vendor: OpenAI
        api-key: ${OPENAI_API_KEY:}
      anthropic:
        url: https://api.anthropic.com
        vendor: Anthropic
        api-key: ${ANTHROPIC_API_KEY:}
      gigachat:
        url: https://gigachat.devices.sberbank.ru/api
        vendor: Сбер GigaChat
        api-key: ${GIGACHAT_AUTH_KEY:}
        oauth-url: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
        scope: ${GIGACHAT_SCOPE:GIGACHAT_API_CORP}
      yandex:
        url: https://llm.api.cloud.yandex.net
        vendor: Yandex Cloud
        api-key: ${YANDEX_API_KEY:}
        folder-id: ${YANDEX_FOLDER_ID:}
    # Paid APIs behind /v1/egress/<name>/ (ADR 0010). One entry per API; the key comes from the environment:
    # egress:
    #   spark:
    #     url: https://api.spark-interfax.ru
    #     vendor: СПАРК-Интерфакс
    #     header: Authorization
    #     value: Bearer ${SPARK_API_KEY:}
    #     price: 15                # when the tenant's catalog has no REQUEST price for the vendor
    #     operations:
    #       - { path: "/v1/companies/{inn}/report", method: GET, product: report, price: 450 }

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
