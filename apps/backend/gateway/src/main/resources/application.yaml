server:
  port: ${GATEWAY_PORT:8081}

spring:
  application:
    name: gateway
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
